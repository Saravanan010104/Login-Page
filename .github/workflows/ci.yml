name: CI

on:
  push:
    branches: [ main, '**' ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build with Maven
        run: mvn -B -ntp clean verify

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ config-server, discovery-service, gateway, auth-service, catalog-service, cart-service, order-service, payment-service, ui-web ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.module }}:latest
