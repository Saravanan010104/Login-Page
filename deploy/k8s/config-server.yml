apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: ecommerce
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: ghcr.io/your-org/config-server:latest
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: config-repo
              mountPath: /workspace/deploy/config-repo
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: native
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config-repo
          emptyDir: {}
