---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: ghcr.io/your-org/catalog-service:latest
          ports:
            - containerPort: 9002
          env:
            - name: SPRING_CLOUD_CONFIG_URI
              value: http://config-server.ecommerce.svc.cluster.local:8888
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server.ecommerce.svc.cluster.local:8761/eureka/
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.ecommerce.svc.cluster.local:5432/catalogdb
            - name: SPRING_DATASOURCE_USERNAME
              value: catalog
            - name: SPRING_DATASOURCE_PASSWORD
              value: catalog
            - name: SPRING_DATA_REDIS_HOST
              value: redis.ecommerce.svc.cluster.local
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
