apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  selector:
    app: auth-service
  ports:
    - port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/your-org/auth-service:latest
          ports:
            - containerPort: 9001
          env:
            - name: SPRING_CLOUD_CONFIG_URI
              value: http://config-server.ecommerce.svc.cluster.local:8888
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server.ecommerce.svc.cluster.local:8761/eureka/
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.ecommerce.svc.cluster.local:5432/authdb
            - name: SPRING_DATASOURCE_USERNAME
              value: auth
            - name: SPRING_DATASOURCE_PASSWORD
              value: auth
---
apiVersion: v1
