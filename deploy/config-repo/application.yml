management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  level:
    root: INFO
    org.springframework: INFO
  pattern:
    level: "%5p [traceId=%X{traceId:-} spanId=%X{spanId:-}]"

spring:
  jackson:
    default-property-inclusion: non_null
  main:
    banner-mode: console
  threads:
    virtual:
      enabled: true
server:
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/xml,text/css,application/javascript
    min-response-size: 1024
